<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <!-- Official Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #b22222;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .seat {
            display: inline-block;
            margin: 5px;
            padding: 10px;
            background: white;
            color: black;
            cursor: pointer;
            border-radius: 4px;
        }
        .seat.selected {
            background: #2e8b57;
            color: white;
        }
        #proceedToPayBtn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ffcc00;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Book Your Movie Tickets (Max 10)</h1>
    
    <h3>Select Seats (Click to select):</h3>
    <div id="seat-container">
        <!-- Sample Seats -->
        <div class="seat">A1</div>
        <div class="seat">A2</div>
        <div class="seat">A3</div>
        <div class="seat">A4</div>
        <div class="seat">A5</div>
    </div>

    <br>
    <button id="proceedToPayBtn">Proceed to Pay</button>

    <script>
        // Toggle seat selection
        document.querySelectorAll('.seat').forEach(seat => {
            seat.addEventListener('click', () => {
                seat.classList.toggle('selected');
            });
        });

        // Proceed to Pay Click Event Handler
        document.getElementById('proceedToPayBtn').addEventListener('click', async () => {
            const selectedSeats = Array.from(document.querySelectorAll('.seat.selected')).map(s => s.textContent);
            const amount = selectedSeats.length * 150; // ₹150 per seat

            if (selectedSeats.length === 0) {
                alert("Please select at least one seat!");
                return;
            }

            try {
                // 1. CALL YOUR SPRING BOOT BACKEND (Replace with your actual EC2 Public IP)
                const backendUrl = 'http://13.201.77.59>:8080/api/payment/create-order?amount=' + amount;
                
                const response = await fetch(backendUrl, {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error("Server error: " + response.status);
                }

                const order = await response.json();

                // 2. CONFIGURE RAZORPAY CHECKOUT OPTIONS
                const options = {
                    "key": "rzp_live_ThV1DZFZJlCYuF", // Replace with your Razorpay Test Key ID
                    "amount": order.amount,
                    "currency": "INR",
                    "name": "Movie Ticket Booking",
                    "description": "Seats: " + selectedSeats.join(', '),
                    "order_id": order.id,
                    "handler": function (response){
                        alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
                        // Optional: Send booking record details here to log into Google Sheets
                    },
                    "theme": {
                        "color": "#3399cc"
                    }
                };

                const rzp1 = new Razorpay(options);
                rzp1.open();

            } catch (error) {
                console.error("Payment initialization failed:", error);
                alert("Could not connect to payment server. Check F12 Console.");
            }
        });
    </script>

</body>
</html>
